[project]
name = "sir-change-classifier"
version = "0.1.0"
description = "Interactive tool for students to classify land cover with AlphaEarth embeddings"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aef-loader>=0.3.0",
    "fastapi>=0.141.1",
    "gcsfs>=2026.8.0",
    "google-cloud-storage>=3.13.1",
    "gunicorn>=26.2.0",
    "numpy>=2.5.2",
    "pillow>=12.3.0",
    "pydantic>=2.13.5",
    "pyproj>=3.7.2",
    "rasterio>=1.5.1",
    "rioxarray>=0.23.0",
    "scikit-learn>=1.9.0",
    "slowapi>=0.1.10",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: hits the real AlphaEarth source over the network (deselect with -m 'not live')"]
